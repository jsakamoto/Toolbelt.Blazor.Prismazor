<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prismizor is a C# port of Prism.js for Blazor. It highlights code with no JavaScript, and it makes the same HTML as Prism.js." />
    <title>Prismizor - A Port of Prism.js to Blazor</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="nupkg-icon.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="HomePage.styles.css" />
    <script type="importmap"></script>
    <script>
        // This is not JS interop. It applies the saved color mode before the first paint, to avoid a flash of the wrong color.
        (() => {
            try {
                const mode = localStorage.getItem("prismizor-color-mode");
                if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
            } catch { }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading" role="status">Loading...</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#x1F5D9;</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
